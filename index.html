<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REM: THE LAST HUMAN WORLD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game Canvas Container -->
    <div id="game-container"></div>

    <!-- UI Overlay -->
    <div id="ui-container">
        <div class="game-title">REM: THE LAST HUMAN WORLD</div>
        
        <!-- Survival Stats HUD -->
        <div class="stats-panel">
            <div class="stat-bar-wrapper">
                <span class="stat-label">HEALTH</span>
                <div class="stat-bar-outer">
                    <div id="health-bar" class="stat-bar-inner health" style="width: 100%;"></div>
                </div>
            </div>
            
            <div class="stat-bar-wrapper">
                <span class="stat-label">HUNGER</span>
                <div class="stat-bar-outer">
                    <div id="hunger-bar" class="stat-bar-inner hunger" style="width: 100%;"></div>
                </div>
            </div>
            
            <div class="stat-bar-wrapper">
                <span class="stat-label">THIRST</span>
                <div class="stat-bar-outer">
                    <div id="thirst-bar" class="stat-bar-inner thirst" style="width: 100%;"></div>
                </div>
            </div>
            
            <div class="stat-bar-wrapper">
                <span class="stat-label">STAMINA</span>
                <div class="stat-bar-outer">
                    <div id="stamina-bar" class="stat-bar-inner stamina" style="width: 100%;"></div>
                </div>
            </div>
        </div>

        <!-- Camera Mode Indicator -->
        <div id="camera-mode-badge" class="badge">CAMERA: 3RD PERSON [V]</div>
    </div>

    <!-- Crosshair for First Person -->
    <div id="crosshair">+</div>

    <!-- Start Overlay / Controls Prompt -->
    <div id="instructions">
        <div class="instructions-card">
            <h1>REM: THE LAST HUMAN WORLD</h1>
            <p class="subtitle">Tokyo Park Prototype v0.1</p>
            <hr>
            <div class="controls-grid">
                <div><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move</div>
                <div><span class="key">Mouse</span> Look Around</div>
                <div><span class="key">Shift</span> Sprint</div>
                <div><span class="key">Space</span> Jump</div>
                <div><span class="key">V</span> Toggle Camera (1st / 3rd Person)</div>
            </div>
            <button id="start-btn">CLICK TO PLAY</button>
        </div>
    </div>

    <!-- Three.js Library Import (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
